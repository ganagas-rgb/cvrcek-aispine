apiVersion: cvrcek.spine/v3
kind: ArchivarModuleManifest

Envelope:
  metadata:
    name: "cvrcek-archivar-core"
    version: "0.0.2"
    author: "ganagas-rgb"
    license: "Apache-2.0"
    scope: "cluster_wide"
    description: >
      Centrálna pamäťová a RAG služba pre Cvrček Spine.
      Archivár je špecializovaný WRK modul typu "central_data_store",
      ktorý poskytuje jednotnú identitu, kontext, vektorové indexy,
      auditné logy a age-rotovanú kryptografickú kontinuitu.

  references:
    naming_standard_ref: "cvrcek-naming-standard-1.0.0"
    rrid_standard_ref: "RRIDStandard-0.3.5"
    rag_global_ref: "cvrcek-rag-main-global-3.5.0"

Payload:

  spec:

    architecture_role:
      type: "specialized_wrk"
      pattern: "central_data_store"
      description: >
        Archivár je pre Spine tým, čím je centrálna databáza pre aplikácie.
        CAI a WRK moduly sa k nemu pripájajú cez definované rozhranie
        bez duplikácie pamäťových alebo RAG kapacít.

    # -------------------------------------------------------------
    # ENVELOPE / PAYLOAD – jednotný formát pre celý Spine v3
    # -------------------------------------------------------------
    envelope_payload_model:

      envelope:
        description: "Auditná meta-obálka, spracovaná CAI."
        visibility: "CAI-only"
        fields:
          - rrid_source
          - rrid_target
          - rrid_final
          - timestamp
          - depth_hops
          - visited_rrids
          - integrity_hash
          - payload_hash
          - audit_trace
        naming: "Podľa naming_standard_ref"
        processed_by: "CAI"
        notes: >
          Envelope je nemenná meta-vrstva. CAI nikdy nevidí payload.
          Archivár ukladá envelope ako append-only audit artefakt.

      payload:
        description: "Obsah požiadavky, spracovaný WRK."
        visibility: "WRK-only"
        fields:
          - rrid_payload
          - sealed_with
          - context
          - data
        naming: "Podľa naming_standard_ref"
        processed_by: "WRK"
        notes: >
          Payload je nepriehľadný pre CAI. Archivár ukladá payload
          výhradne vo forme age-šifrovaných artefaktov.

    # -------------------------------------------------------------
    # DATA LIFECYCLE TIERING (DOPLNENÉ PODĽA PÔVODNÉHO NÁVRHU)
    # -------------------------------------------------------------
    data_lifecycle_tiers:

      hot:
        retention: "2-3 dni"
        path: "cvrcek-spine/runtime/spool/outbox/"
        format: "Surový JSON payload + envelope (meta + rrid + sha256)"
        purpose: "Okamžitý audit stopy a live operácie WRK/CAI."
        notes: >
          HOT vrstva je najrýchlejšia. Obsahuje najnovšie envelope/payload artefakty
          pred presunom do WARM. Slúži na okamžitú rekonštrukciu requestov.

      warm:
        retention: "14 dní"
        path: "cvrcek-spine/runtime/archive/warm/"
        format: "Indexované JSON matice"
        purpose: "Priamy zdroj dát pre lokálny JSON RAG."
        notes: >
          WARM vrstva je optimalizovaná pre rýchle čítanie. Lokálny Qwen/Phi-3
          odtiaľto ťahá čerstvý kontext.

      cold:
        retention: "30 dní"
        path: "cvrcek-spine/runtime/archive/cold/"
        format: "Komprimované štruktúry"
        purpose: "Lokálna záloha, odpojená od indexovania do RAG knowledgebase."
        notes: >
          COLD vrstva je komprimovaná, ale stále lokálne dostupná. Slúži ako
          strednodobá záloha pred archiváciou.

      archive:
        retention: ">30 dní"
        path: "TSM / Pásky / Externé úložisko"
        format: ".tar.gz / .zip zašifrované cez age"
        purpose: "Dlhodobá archivácia podľa legislatívy."
        notes: >
          ARCHIVE vrstva je nemenná. Lokálny disk je po archivácii vyčistený (0B).
          Dešifrovanie je možné len cez age kľúče z crypto_time_travel_matrix.

    # -------------------------------------------------------------
    # SERVICE ENDPOINTS
    # -------------------------------------------------------------
    service_endpoints:

      rag_service:
        description: "Sémantické vyhľadávanie a kontext pre CAI a WRK"
        access: "read_only"
        backends:
          - "sqlite_metadata"
          - "vector_db"

      matrika_service:
        description: "Správa anonymných identít (RRID) a registrácia modulov"
        access: "read_write"
        security: "age_key_rotation"

      audit_logger:
        description: "Ukladanie obálok (envelope) pre neskorší audit a rekonštrukciu"
        access: "append_only"

    # -------------------------------------------------------------
    # AUDIT ENVELOPE STRUCTURE
    # -------------------------------------------------------------
    audit_envelope_structure:
      meta:
        rrid: "RRID požiadavky"
        sha256: "Hash celého payloadu"
        age_key_thumbprint: "SHA256 verejného age kľúča"
        timestamp: "POSIX čas zápisu"
        filename: "Podľa naming_standard_ref"

status:
  stable: true
  notes: >
    Archivár nevykonáva smerovanie ani rozhodovanie.
    Poskytuje výhradne dáta na základe RRID/THREADID a dopytov z obálok.
    Je jediným zdrojom pravdy pre identitu, kontext a auditnú históriu.